
name: Deploy Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cp .github/ssh/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 deploy@mon-serveur.fr \
            bash -se -- "$RELEASE_TAG" <<'EOF'
            set -e
            TAG="$1"

            cd /opt/postgres-workout-api
            git fetch origin --tags
            git checkout --detach "refs/tags/$TAG"

            docker compose up -d --build --no-deps postgres-workout-api
          EOF
